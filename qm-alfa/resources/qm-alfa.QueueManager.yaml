apiVersion: mq.ibm.com/v1beta1
kind: QueueManager
metadata:
  name: qm-alfa
  annotations:
    com.ibm.mq/write-defaults-spec: 'false'
  namespace: mq
spec:
  license:
    accept: true
    license: L-EHXT-MQCRN9
    use: Production
  web:
    enabled: true
    console:
      authentication:
        provider: manual
      authorization:
        provider: manual
    manualConfig:
      configMap:
        name: mqwebuserconfigmap
  template:
    pod:
      containers:
        - env:
          name: qmgr
  queueManager:
    mqsc:
      - configMap:
          name: qm-alfa-mqsc
          items:
            - qm-alfa.mqsc
    resources:
      limits:
        cpu: 500m
      requests:
        cpu: 500m
    storage:
      queueManager:
        type: persistent-claim
  version: 9.4.0.5-r2